<svg width="1200" height="900" viewBox="0 0 1200 900"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020603"/>
    <stop offset="50%" stop-color="#071309"/>
    <stop offset="100%" stop-color="#020603"/>
  </linearGradient>

  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0b1c0e"/>
    <stop offset="100%" stop-color="#050d07"/>
  </linearGradient>

  <pattern id="grid" width="30" height="30"
           patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30"
          fill="none"
          stroke="#16451c"
          stroke-width="1"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="avatarClip">
    <circle cx="125" cy="155" r="55"/>
  </clipPath>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect width="1200" height="900"
      rx="20"
      fill="url(#background)"/>

<rect width="1200" height="900"
      rx="20"
      fill="url(#grid)"
      opacity="0.45"/>

<rect x="8" y="8"
      width="1184"
      height="884"
      rx="18"
      fill="none"
      stroke="#276a31"
      stroke-width="2"/>


