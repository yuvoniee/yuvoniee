<svg width="1200" height="1050" viewBox="0 0 1200 1050"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020702"/>
    <stop offset="55%" stop-color="#071608"/>
    <stop offset="100%" stop-color="#020502"/>
  </linearGradient>

  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28"
          fill="none"
          stroke="#16351b"
          stroke-width="1"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


