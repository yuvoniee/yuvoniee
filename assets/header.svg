<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020702"/>
    <stop offset="55%" stop-color="#061408"/>
    <stop offset="100%" stop-color="#020502"/>
  </linearGradient>

  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28"
          fill="none"
          stroke="#16351b"
          stroke-width="1"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="260" rx="22" fill="url(#bg)"/>
<rect width="1200" height="260" rx="22" fill="url(#grid)" opacity="0.55"/>

<!-- OUTER BORDER -->
<rect x="8" y="8"
      width="1184"
      height="244"
      rx="20"
      fill="none"
      stroke="#315f35"
      stroke-width="2"/>

<rect x="18" y="18"
      width="1164"
      height="224"
      rx="16"
      fill="none"
      stroke="#15371a"
      stroke-width="1"/>

<!-- TERMINAL BAR -->
<rect x="38" y="32"
      width="1124"
      height="58"
      rx="12"
      fill="#020602"
      stroke="#2b6331"
      stroke-width="1.5"/>

<!-- TERMINAL DOTS -->
<circle cx="64" cy="61" r="9" fill="#8cff83" filter="url(#glow)"/>
<circle cx="91" cy="61" r="9" fill="#34753b"/>
<circle cx="118" cy="61" r="9" fill="#1e4725"/>

<!-- TERMINAL TITLE -->
<text x="150" y="68"
      font-family="monospace"
      font-size="20"
      font-weight="bold"
      fill="#91ff89">
  YUVONIEE://PROFILE
</text>

<!-- STATUS -->
<circle cx="1090" cy="61" r="5" fill="#8cff83"/>
<text x="1104" y="67"
      font-family="monospace"
      font-size="14"
      fill="#8cff83">
  ONLINE
</text>

<!-- MAIN TEXT -->
<text x="65" y="142"
      font-family="monospace"
      font-size="36"
      font-weight="bold"
      fill="#8cff83">
  GRANTHINI C A
</text>

<text x="66" y="171"
      font-family="monospace"
      font-size="16"
      fill="#67a86d">
  @yuvoniee // she/her
</text>

<text x="66" y="204"
      font-family="monospace"
      font-size="19"
      font-weight="bold"
      fill="#d1ffd0">
  CSE // PYTHON // AI
</text>

<text x="66" y="230"
      font-family="monospace"
      font-size="15"
      fill="#8cff83">
  building things • breaking things • fixing things
</text>

<!-- RIGHT SIDE -->
<text x="900" y="150"
      font-family="monospace"
      font-size="15"
      fill="#8cff83">
  [ VIBE-CODED ]
</text>

<text x="900" y="178"
      font-family="monospace"
      font-size="13"
      fill="#4f8955">
  occasionally understood
</text>

</svg>