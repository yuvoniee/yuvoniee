<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020703"/>
    <stop offset="55%" stop-color="#071409"/>
    <stop offset="100%" stop-color="#020603"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#17451d" stroke-width="1"/>
  </pattern>
</defs>

<!-- background -->
<rect width="1200" height="260" rx="18" fill="url(#bg)"/>
<rect width="1200" height="260" rx="18" fill="url(#grid)" opacity="0.45"/>

<!-- outer border -->
<rect x="10" y="10" width="1180" height="240" rx="16"
      fill="none" stroke="#245f2d" stroke-width="2"/>

<!-- terminal window -->
<rect x="45" y="35" width="1110" height="190" rx="14"
      fill="#030904" stroke="#317d3a" stroke-width="2"/>

<!-- terminal header -->
<rect x="45" y="35" width="1110" height="48" rx="14"
      fill="#061008"/>

<circle cx="72" cy="59" r="8" fill="#7cff6b" filter="url(#glow)"/>
<circle cx="98" cy="59" r="8" fill="#397d40"/>
<circle cx="124" cy="59" r="8" fill="#214d29"/>

<text x="155" y="66"
      fill="#9cff91"
      font-family="monospace"
      font-size="18"
      font-weight="bold">
  YUVONIEE://PROFILE
</text>

<text x="1040" y="66"
      fill="#7cff6b"
      font-family="monospace"
      font-size="15">
  ● ONLINE
</text>

<!-- command -->
<text x="85" y="125"
      fill="#70ff61"
      font-family="monospace"
      font-size="17">
  &gt; whoami
</text>

<text x="85" y="155"
      fill="#d2f7ce"
      font-family="monospace"
      font-size="22"
      font-weight="bold">
  GRANTHINI C A
</text>

<text x="85" y="183"
      fill="#80d879"
      font-family="monospace"
      font-size="15">
  CSE // PYTHON // AI
</text>

<text x="85" y="207"
      fill="#69c962"
      font-family="monospace"
      font-size="14">
  building things • breaking things • fixing things
</text>

<!-- right status -->
<text x="940" y="145"
      fill="#7cff6b"
      font-family="monospace"
      font-size="13">
  [ VIBE-CODED ]
</text>

<text x="940" y="173"
      fill="#4e9e50"
      font-family="monospace"
      font-size="12">
  side_quests: MANY
</text>

<text x="940" y="198"
      fill="#4e9e50"
      font-family="monospace"
      font-size="12">
  bugs: PROBABLY
</text>

</svg>